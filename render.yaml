services:
  - type: web
    name: omni-framework
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Jakarta
    healthCheckPath: /api/v1/health
    autoDeploy: true
    numInstances: 1
