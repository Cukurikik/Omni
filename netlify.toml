# ==========================================
# 📦 OMNI FRAMEWORK — Netlify Configuration
# Generated by: omni deploy netlify
# ==========================================
[build]
  command = "cd ui && npm run build"
  publish = "ui/dist"
  functions = "api/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "api/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5173
