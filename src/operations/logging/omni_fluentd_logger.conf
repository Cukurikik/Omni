# OMNI Logging & Observability Layer
# Fluentd configuration for securely aggregating structured JSON logs
# emitted by the Omni Universal Binary, parsing errors via Ruby logic, 
# and streaming to Elasticsearch.

<source>
  @type tail
  path /var/log/omni/inference.log
  pos_file /var/log/td-agent/omni_inference.pos
  tag omni.inference
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

<source>
  @type tail
  path /var/log/omni/system.log
  pos_file /var/log/td-agent/omni_system.pos
  tag omni.system
  <parse>
    @type regexp
    # Regex parsing standard text logs outputted by C/C++ core
    expression /^\[(?<time>[^\]]*)\] \[(?<level>[A-Z]+)\] (?<message>.*)$/
    time_format %Y-%m-%d %H:%M:%S
  </parse>
</source>

# Ruby-based filter for anomaly tagging
<filter omni.inference>
  @type record_transformer
  enable_ruby true
  <record>
    # Tag requests that take longer than 1 second as slow
    is_slow_query ${record["duration_ms"] > 1000 ? true : false}
    # Calculate token generation speed
    tokens_per_sec ${record["tokens"] / (record["duration_ms"] / 1000.0)}
  </record>
</filter>

# Route filtered logs to Elasticsearch cluster for Kibana visualization
<match omni.**>
  @type elasticsearch
  host elasticsearch.omni.internal
  port 9200
  logstash_format true
  logstash_prefix omni-logs
  flush_interval 5s
  <buffer>
    @type file
    path /var/log/td-agent/buffer/omni
    flush_thread_count 4
  </buffer>
</match>
