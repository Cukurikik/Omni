# Omni Fluentd Daemon Configuration (Conf)
# Operations Layer
# A lighter alternative to Logstash, utilizing Fluentd for collecting 
# container stdout streams and forwarding them securely.

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter omni.container.**>
  @type record_transformer
  <record>
    hostname ${hostname}
    datacenter "us-east-1"
    framework "omni-mother-nexus"
  </record>
</filter>

<match omni.container.**>
  @type copy
  
  <store>
    @type elasticsearch
    host elasticsearch.omni.internal
    port 9200
    logstash_format true
    logstash_prefix omni-fluentd
    logstash_dateformat %Y%m%d
    include_tag_key true
    type_name access_log
    tag_key @log_name
    flush_interval 5s
  </store>
  
  <store>
    @type stdout
  </store>
</match>
