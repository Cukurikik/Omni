# Omni Fluent Bit Configuration
# Operations & Observability Layer
# High-performance log processor and forwarder for distributed Omni nodes.
# Extracts structured telemetry and ships to Elasticsearch / Loki.

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         /var/log/omni/*.log
    Tag          omni.core
    Read_from_Head True
    Parser       json

[INPUT]
    Name         systemd
    Tag          omni.system
    Systemd_Filter _SYSTEMD_UNIT=omni.service

[FILTER]
    # Inject environment metadata
    Name         record_modifier
    Match        *
    Record       cluster_id omni-prod-us-east
    Record       node_role gpu-worker

[FILTER]
    # Extract latency metrics for Prometheus mapping if needed
    Name         grep
    Match        omni.core
    Regex        log .*latency_ms.*

[OUTPUT]
    Name         es
    Match        *
    Host         elasticsearch.omni-nexus.internal
    Port         9200
    Index        omni-telemetry
    Type         _doc
    HTTP_User    admin
    HTTP_Passwd  ${OMNI_ES_PASSWORD}
    Retry_Limit  5
