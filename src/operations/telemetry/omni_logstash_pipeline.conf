# Omni Logstash Pipeline (Conf)
# Operations & Data Layer
# Parses incoming streams of inference metrics (JSON or Nginx logs) and 
# standardizes them before pushing to Elasticsearch for the Kibana dashboards.

input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # If the log contains Omni gRPC access patterns, parse the string
  if [message] =~ /^Omni-gRPC/ {
    grok {
      match => { "message" => "Omni-gRPC\s+%{IP:client_ip}\s+\[%{HTTPDATE:timestamp}\]\s+%{NUMBER:latency_ms:float}\s+%{WORD:model_id}" }
    }
  }

  # Add geographical location based on client IP
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Mutate fields to ensure proper mapping in Elasticsearch
  mutate {
    add_field => { "omni_version" => "3.0.0-OMNI-NEXUS" }
    convert => {
      "latency_ms" => "float"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "omni-inference-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
  
  # Failover logging to local file if ES is unreachable
  file {
    path => "/var/log/logstash/omni_fallback.log"
  }
}
