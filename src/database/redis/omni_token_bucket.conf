# OMNI Framework - Redis Configuration for Rate Limiting
# Configured for high-throughput, low-latency token bucket operations

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 4gb
maxmemory-policy allkeys-lru

# Persistence (AOF for durability of rate limits)
appendonly yes
appendfsync everysec

# Tuning
tcp-keepalive 300
timeout 0

# Security (Placeholder, configure via ENV in production)
# requirepass ${REDIS_PASSWORD}

# LUA Script caching is highly recommended for atomic token bucket operations.
# See src/network/go/rate_limiter.go for the script implementation.
