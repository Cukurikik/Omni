# OMNI Framework - Redis Configuration for MoE Routing and Quotas
# Optimized for high-throughput Pub/Sub (streaming tokens) and atomic 
# decrements (tenant quota management)

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Memory Management
# We allocate 8GB for Redis to comfortably store tenant quotas and 
# temporary KV-cache locators for SGLang cluster routing.
maxmemory 8gb
maxmemory-policy allkeys-lru

# Persistence
# AOF is enabled to ensure tenant quotas are not lost during restarts.
appendonly yes
appendfsync everysec

# Performance Tuning
# Increase maximum number of connected clients for high-concurrency WebSocket nodes
maxclients 20000

# Event notification for keyspace events (useful if we want to trigger actions when quotas expire)
notify-keyspace-events Ex

# IO Threads (utilize multi-core for parsing, keeping main thread free for execution)
io-threads 4
io-threads-do-reads yes
