# OMNI Framework - Redis Configuration for NLP Session Store
# Optimized for high-throughput, low-latency caching of TextGenerator.io sessions

# Bind to all interfaces for internal swarm access
bind 0.0.0.0

# Run in background
daemonize yes

# Port
port 6379

# Max memory constraint (ensures Redis doesn't crash the host)
maxmemory 4gb

# Eviction policy: Remove least recently used keys when memory is full
# Ideal for NLP session caching where old sessions are less relevant
maxmemory-policy allkeys-lru

# Snapshotting (Save DB to disk)
# Save after 900 sec (15 min) if at least 1 key changed
save 900 1
# Save after 300 sec (5 min) if at least 10 keys changed
save 300 10

# Append Only File (AOF) for better durability
appendonly yes
appendfsync everysec

# Tuning
tcp-keepalive 300
timeout 0
