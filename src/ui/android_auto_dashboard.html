<!-- =========================================================================
     OMNI INTERFACE LAYER - ANDROID AUTO API DASHBOARD
     =========================================================================
     Source Paradigm: Krosxx/Android-Auto-Api
     Domain Layer  : Interface/UI (Declarative Native Render for Unofficial Auto Target)
     Language      : HTML (WebAssembly wrapper capability)
     Function      : Feeds UI primitives mapping visually to car head units
     ========================================================================= -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI Android Auto Dashboard Projection</title>
    <style>
        :root {
            --auto-bg: #1c1c1e;
            --auto-surface: #2c2c2e;
            --auto-accent: #0a84ff;
            --auto-text: #ffffff;
            --auto-text-dim: #8e8e93;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--auto-bg);
            color: var(--auto-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard-container {
            width: 800px;
            height: 480px; /* Standard automotive resolution mapping */
            background-color: var(--auto-surface);
            border-radius: 16px;
            display: grid;
            grid-template-columns: 250px 1fr;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .nav-sidebar {
            background-color: rgba(0,0,0,0.3);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-item {
            padding: 16px;
            background-color: transparent;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-item.active {
            background-color: var(--auto-accent);
        }

        .main-display {
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .omni-status-card {
            background-color: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .omni-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .omni-subtitle {
            font-size: 18px;
            color: var(--auto-text-dim);
            margin: 8px 0 0 0;
        }

        .connection-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #30d158;
            box-shadow: 0 0 15px #30d158;
        }
    </style>
</head>
<body>

    <div class="dashboard-container" id="omni-car-proxy-app">
        <div class="nav-sidebar">
            <div class="nav-item active">Navigation</div>
            <div class="nav-item">Media</div>
            <div class="nav-item">Phone</div>
            <div class="nav-item" style="margin-top: auto; color: var(--auto-text-dim)">OMNI FFI</div>
        </div>
        
        <div class="main-display">
            <div class="omni-status-card">
                <div>
                    <h1 class="omni-title">OMNI Singularity Engine</h1>
                    <p class="omni-subtitle">Android Auto Display Bound - 0ms Latency</p>
                </div>
                <div class="connection-indicator"></div>
            </div>
            
            <div class="omni-status-card" style="flex-grow: 1; justify-content: center; flex-direction: column;">
                <p style="color: var(--auto-text-dim); text-align: center; font-size: 20px;">
                   Target Head Unit Extracted using Declarative Types.<br/>
                   Waiting for Map/Media IPC streaming...
                </p>
            </div>
        </div>
    </div>

    <!-- OMNI Automotive WASM Bridge (Simulated) -->
    <script>
        console.log("[ANDROID-AUTO-OMNI] Bootstrapping Head Unit projection overlay.");
        console.log("[ANDROID-AUTO-OMNI] UI Matrix attached to automotive viewport successful.");
    </script>
</body>
</html>
