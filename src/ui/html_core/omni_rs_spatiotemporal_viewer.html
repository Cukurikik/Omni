<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni RS SpatioTemporal VLM Viewer</title>
    <style>
        :root { --omni-bg: #0d1117; --omni-fg: #c9d1d9; }
        body { background: var(--omni-bg); color: var(--omni-fg); font-family: system-ui, sans-serif; }
        .omni-container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .viewer-box { width: 100%; height: 400px; border: 1px solid #30363d; background: #161b22; }
    </style>
</head>
<body>
    <!-- Omni HTML UI Layer: Zero-mock declarative structure -->
    <main class="omni-container" id="omni-root-bridge">
        <header>
            <h1>Omni RS SpatioTemporal Viewport</h1>
            <p>Strict semantic rendering for multi-modal remote sensing models.</p>
        </header>
        <section aria-label="Tensor Visualization">
            <div id="vlm-viewer" class="viewer-box">
                <!-- Controlled strictly via WebGL / Omni TS Bridge -->
            </div>
        </section>
    </main>
</body>
</html>
