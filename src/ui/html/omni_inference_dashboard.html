<!-- OMNI Interface Layer — HTML Inference Dashboard -->
<!-- Semantic HTML5 dashboard for OMNI model monitoring. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OMNI Transformer Inference Dashboard - Real-time model monitoring">
    <title>OMNI Inference Dashboard</title>
    <style>
        :root {
            --bg: #0a0e1a; --surface: #131829; --border: #1e2740;
            --primary: #6366f1; --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
            --text: #e2e8f0; --text-muted: #94a3b8;
            --font: 'Inter', -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
        .dashboard { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 24px; }
        .sidebar h1 { font-size: 1.5rem; background: linear-gradient(135deg, var(--primary), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 32px; }
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; color: var(--text-muted); transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(99,102,241,0.1); color: var(--text); }
        .main { padding: 32px; overflow-y: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .stat-card .label { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 8px; }
        .stat-card .value { font-size: 2rem; font-weight: 700; }
        .stat-card .trend { font-size: 0.75rem; margin-top: 4px; }
        .trend.up { color: var(--success); }
        .trend.down { color: var(--danger); }
        .chat-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .chat-container h2 { margin-bottom: 16px; font-size: 1.25rem; }
        .chat-messages { max-height: 400px; overflow-y: auto; margin-bottom: 16px; }
        .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; max-width: 80%; }
        .message.user { background: var(--primary); margin-left: auto; }
        .message.assistant { background: var(--border); }
        .input-row { display: flex; gap: 12px; }
        .input-row input { flex: 1; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; outline: none; }
        .input-row input:focus { border-color: var(--primary); }
        .input-row button { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .input-row button:hover { opacity: 0.9; }
        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } .sidebar { display: none; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h1>⚡ OMNI</h1>
            <nav>
                <div class="nav-item active" id="nav-overview">📊 Overview</div>
                <div class="nav-item" id="nav-models">🤖 Models</div>
                <div class="nav-item" id="nav-inference">💬 Inference</div>
                <div class="nav-item" id="nav-metrics">📈 Metrics</div>
                <div class="nav-item" id="nav-settings">⚙️ Settings</div>
            </nav>
        </aside>
        <main class="main">
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="label">Total Requests</div>
                    <div class="value" id="total-requests">0</div>
                    <div class="trend up">↑ 12% from last hour</div>
                </div>
                <div class="stat-card">
                    <div class="label">Avg Latency</div>
                    <div class="value" id="avg-latency">0ms</div>
                    <div class="trend down">↓ 5% improved</div>
                </div>
                <div class="stat-card">
                    <div class="label">Active Models</div>
                    <div class="value" id="active-models">0</div>
                    <div class="trend up">3 deployed</div>
                </div>
                <div class="stat-card">
                    <div class="label">Tokens/sec</div>
                    <div class="value" id="tokens-sec">0</div>
                    <div class="trend up">↑ GPU optimized</div>
                </div>
            </section>
            <section class="chat-container">
                <h2>💬 Live Inference</h2>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="input-row">
                    <input type="text" id="chat-input" placeholder="Enter your prompt..." autocomplete="off">
                    <button id="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </section>
        </main>
    </div>
    <script>
        const API_URL = 'http://localhost:8080/api/v1';
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const prompt = input.value.trim();
            if (!prompt) return;
            addMessage(prompt, 'user');
            input.value = '';
            try {
                const res = await fetch(`${API_URL}/infer`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({prompt, max_tokens: 256, temperature: 0.7})
                });
                const data = await res.json();
                addMessage(data.generated_text || 'No response', 'assistant');
                updateStats();
            } catch(e) { addMessage('Error: ' + e.message, 'assistant'); }
        }
        function addMessage(text, role) {
            const el = document.createElement('div');
            el.className = `message ${role}`;
            el.textContent = text;
            document.getElementById('chat-messages').appendChild(el);
            el.scrollIntoView({behavior:'smooth'});
        }
        async function updateStats() {
            try {
                const res = await fetch(`${API_URL}/health`);
                const s = await res.json();
                document.getElementById('total-requests').textContent = s.total_requests || 0;
                document.getElementById('avg-latency').textContent = (s.avg_latency_ms||0).toFixed(1)+'ms';
            } catch {}
        }
        document.getElementById('chat-input').addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });
        setInterval(updateStats, 5000);
        updateStats();
    </script>
</body>
</html>
