<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI FedML - Cluster Topology</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        .node { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; transition: transform 0.2s; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .node:hover { transform: scale(1.1); }
        .server { background: linear-gradient(135deg, #8957e5, #d2a8ff); width: 80px; height: 80px; z-index: 10; border: 2px solid #fff; }
        .client { background: linear-gradient(135deg, #238636, #2ea043); width: 40px; height: 40px; z-index: 5; border: 1px solid #fff; }
        .offline { background: linear-gradient(135deg, #da3633, #f85149); }
        .edge { position: absolute; background-color: #30363d; transform-origin: 0 50%; z-index: 1; }
        .status-panel { position: absolute; top: 20px; left: 20px; background: rgba(22, 27, 34, 0.8); padding: 15px; border-radius: 8px; border: 1px solid #30363d; backdrop-filter: blur(5px); z-index: 20; }
        h2 { margin: 0 0 10px 0; font-size: 16px; color: #58a6ff; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="status-panel">
            <h2>FedML Live Topology</h2>
            <div id="stats">Active Nodes: 0</div>
        </div>
    </div>

    <script>
        // OMNI FEDML: Topology Map
        // Vanilla JS rendering of federated learning clients connected to an aggregator.
        
        const container = document.getElementById('canvas-container');
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        
        // Render central server
        const server = document.createElement('div');
        server.className = 'node server';
        server.innerText = 'AGG';
        server.style.left = `${cx - 40}px`;
        server.style.top = `${cy - 40}px`;
        container.appendChild(server);

        // Render clients in a circle
        const numClients = 12;
        const radius = 250;
        
        for(let i = 0; i < numClients; i++) {
            const angle = (i / numClients) * 2 * Math.PI;
            const x = cx + radius * Math.cos(angle);
            const y = cy + radius * Math.sin(angle);
            
            // Draw Edge
            const edge = document.createElement('div');
            edge.className = 'edge';
            const distance = Math.hypot(x - cx, y - cy);
            edge.style.width = `${distance}px`;
            edge.style.height = '2px';
            edge.style.left = `${cx}px`;
            edge.style.top = `${cy}px`;
            edge.style.transform = `rotate(${angle}rad)`;
            container.appendChild(edge);

            // Draw Client
            const client = document.createElement('div');
            const isOffline = Math.random() > 0.8;
            client.className = `node client ${isOffline ? 'offline' : ''}`;
            client.innerText = `W${i+1}`;
            client.style.left = `${x - 20}px`;
            client.style.top = `${y - 20}px`;
            container.appendChild(client);
        }
        
        document.getElementById('stats').innerText = `Active Nodes: ${Math.floor(numClients * 0.8)} / ${numClients}`;
    </script>
</body>
</html>
