<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>vLLM Throughput Monitor</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        .metric { margin-bottom: 10px; }
        .val { font-weight: bold; font-size: 1.2em; color: #fff; }
    </style>
</head>
<body>
    <h1>vLLM Engine Status</h1>
    <div class="metric">Tokens/sec: <span class="val">4,502</span></div>
    <div class="metric">KV Cache Usage: <span class="val">82%</span></div>
    <div class="metric">Active Requests: <span class="val">142</span></div>
</body>
</html>
