<!-- OMNI Interface Layer: alan_voice_widget.html -->
<!-- Alan AI Web SDK native integration. Minimal DOM surface. -->
<!-- Bounds: Only one active Alan button allowed on screen -->

<template id="omni-alan-template">
    <style>
        .omni-alan-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #0088cc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s;
        }
        .omni-alan-container:hover {
            transform: scale(1.1);
        }
    </style>
    <div class="omni-alan-container" id="alan-btn">
        <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
    </div>
</template>

<script>
    class OmniAlanWidget extends HTMLElement {
        static hasInstance = false;

        constructor() {
            super();
            // Strict singleton bounds
            if (OmniAlanWidget.hasInstance) {
                console.error("[OMNI ERROR] Code 1: Only one Alan Voice Widget instance allowed.");
                return;
            }
            OmniAlanWidget.hasInstance = true;

            const template = document.getElementById('omni-alan-template');
            const clone = template.content.cloneNode(true);
            this.attachShadow({ mode: 'open' }).appendChild(clone);
            
            this.shadowRoot.getElementById('alan-btn').addEventListener('click', () => {
                this.dispatchEvent(new CustomEvent('omni-voice-trigger', { bubbles: true, composed: true }));
            });
        }
    }

    customElements.define('omni-alan-widget', OmniAlanWidget);
</script>
