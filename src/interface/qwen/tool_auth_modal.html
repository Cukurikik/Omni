<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI Qwen - Tool Execution Authorization</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: rgba(0,0,0,0.5); margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .modal { background-color: #fff; width: 450px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; }
        .header { background-color: #f39c12; color: #fff; padding: 15px 20px; font-weight: bold; font-size: 1.2em; display: flex; align-items: center; gap: 10px; }
        .content { padding: 20px; }
        .warning { font-size: 0.9em; color: #e67e22; margin-bottom: 15px; }
        .code-block { background-color: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 0.9em; white-space: pre-wrap; margin-bottom: 20px; }
        .actions { background-color: #f8f9fa; padding: 15px 20px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; }
        button { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-deny { background-color: #e74c3c; color: white; }
        .btn-allow { background-color: #2ecc71; color: white; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="modal">
        <div class="header">
            ⚠️ Agent Action Authorization
        </div>
        <div class="content">
            <p>The AI Agent <strong>(Qwen-Agent-01)</strong> is requesting permission to execute a system command on your behalf.</p>
            
            <div class="warning">
                Please review the command carefully before allowing execution.
            </div>

            <strong>Tool:</strong> <code>bash_shell</code>
            <br><br>
            <strong>Command to Execute:</strong>
            <div class="code-block">rm -rf /tmp/cache_folder && python3 scripts/train.py --batch_size 32</div>
        </div>
        <div class="actions">
            <button class="btn-deny" onclick="alert('Action Denied. Agent will be notified.')">Deny</button>
            <button class="btn-allow" onclick="alert('Action Allowed. Executing...')">Allow Execution</button>
        </div>
    </div>

</body>
</html>
