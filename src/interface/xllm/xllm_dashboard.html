<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>xLLM Inference Monitor</title>
<style>body{margin:0;background:#0a0a0a;color:#e0e0e0;font-family:monospace;}
.dash{max-width:1000px;margin:auto;padding:20px;}
table{width:100%;border-collapse:collapse;}th,td{padding:8px;border-bottom:1px solid #333;text-align:left;}
.stat{font-size:2em;color:#58a6ff;}
</style></head><body><div class="dash">
<h1>xLLM Inference Dashboard</h1>
<div class="stat" id="tps">0 tok/s</div>
<table id="slots"><thead><tr><th>Slot</th><th>Request</th><th>Position</th><th>Phase</th></tr></thead>
<tbody></tbody></table>
</div><script>
function updateSlots(data){
  if(data.length>512){console.error('OmniResult: Err(Slot display limit)');return;}
  const tbody=document.querySelector('#slots tbody');
  tbody.innerHTML='';
  data.forEach((s,i)=>{const r=document.createElement('tr');
    r.innerHTML='<td>'+i+'</td><td>'+s.id+'</td><td>'+s.pos+'</td><td>'+s.phase+'</td>';
    tbody.appendChild(r);});
}
</script></body></html>
