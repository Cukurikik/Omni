<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChatKBQA Interface</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #0f0; padding: 20px; }
        .chat-bubble { background: #111; padding: 10px; border: 1px solid #0f0; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Knowledge Base QA</h2>
    <div class="chat-bubble">
        <p><strong>Query:</strong> What is the capital of France?</p>
    </div>
    <div class="chat-bubble">
        <p><strong>Answer:</strong> Paris (Source: Wikidata Q90)</p>
    </div>
</body>
</html>
