<!-- OMNI Interface Layer: kg_visualizer.html -->
<!-- Knowledge Graph Visualizer using Canvas. -->
<!-- Bounds: Max 1000 edges drawn per frame. -->

<template id="kg-visualizer-template">
    <style>
        .kg-canvas-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }
        canvas {
            display: block;
        }
    </style>
    <div class="kg-canvas-container">
        <canvas id="kg-canvas"></canvas>
    </div>
</template>

<script>
    const MAX_EDGES = 1000;

    class KgVisualizer extends HTMLElement {
        constructor() {
            super();
            const template = document.getElementById('kg-visualizer-template');
            this.attachShadow({ mode: 'open' }).appendChild(template.content.cloneNode(true));
            this.canvas = this.shadowRoot.getElementById('kg-canvas');
            this.ctx = this.canvas.getContext('2d');
        }

        renderEdges(edges) {
            if (edges.length > MAX_EDGES) {
                console.error(`[OMNI ERROR] Code 1: Cannot render more than ${MAX_EDGES} edges. Exceeds hardware bounds.`);
                return;
            }

            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.ctx.strokeStyle = '#4a90e2';
            this.ctx.beginPath();
            
            for (const edge of edges) {
                this.ctx.moveTo(edge.startX, edge.startY);
                this.ctx.lineTo(edge.endX, edge.endY);
            }
            
            this.ctx.stroke();
        }
    }

    customElements.define('kg-visualizer', KgVisualizer);
</script>
