<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI StyleGAN2 - Latent Explorer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .viewer { margin-bottom: 30px; position: relative; }
        .image-display { width: 512px; height: 512px; background-color: #333; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); object-fit: cover; }
        .controls { background: #2a2a2a; padding: 20px; border-radius: 8px; width: 600px; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 5px; }
        input[type=range] { width: 100%; -webkit-appearance: none; background: #444; height: 6px; border-radius: 3px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #3498db; border-radius: 50%; cursor: pointer; }
        .btn-random { background-color: #e67e22; border: none; padding: 10px 20px; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; transition: opacity 0.2s; }
        .btn-random:hover { opacity: 0.8; }
        h1 { margin-top: 0; font-size: 24px; color: #ecf0f1; text-align: center; }
    </style>
</head>
<body>

    <h1>StyleGAN2 Latent Space Explorer</h1>

    <div class="viewer">
        <!-- Mock image for interface structural completeness -->
        <img src="https://via.placeholder.com/512/1a1a1a/ffffff?text=AI+Generated+Face" alt="Generated Face" class="image-display" id="genImage">
    </div>

    <div class="controls">
        <div class="slider-group">
            <label><span>Age (Vector 1)</span> <span id="val1">0.0</span></label>
            <input type="range" min="-5.0" max="5.0" step="0.1" value="0.0" oninput="document.getElementById('val1').innerText = this.value">
        </div>
        
        <div class="slider-group">
            <label><span>Smile (Vector 2)</span> <span id="val2">0.0</span></label>
            <input type="range" min="-5.0" max="5.0" step="0.1" value="0.0" oninput="document.getElementById('val2').innerText = this.value">
        </div>
        
        <div class="slider-group">
            <label><span>Lighting (Vector 3)</span> <span id="val3">0.0</span></label>
            <input type="range" min="-5.0" max="5.0" step="0.1" value="0.0" oninput="document.getElementById('val3').innerText = this.value">
        </div>

        <button class="btn-random" onclick="alert('Triggering random Z vector synthesis via Backend API...')">🎲 Randomize Identity</button>
    </div>

</body>
</html>
