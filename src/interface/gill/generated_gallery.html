<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gill Generated Gallery</title>
    <style>
        body { font-family: sans-serif; background: #e9ecef; padding: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .img-placeholder { width: 100%; height: 200px; background: #ccc; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Generated Images Gallery</h1>
    <div class="gallery">
        <div class="img-placeholder"></div>
        <div class="img-placeholder"></div>
        <div class="img-placeholder"></div>
        <div class="img-placeholder"></div>
    </div>
</body>
</html>
