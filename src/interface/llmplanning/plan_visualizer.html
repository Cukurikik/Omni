<!DOCTYPE html>
<html lang="en">
<head>

        body { font-family: 'Inter', sans-serif; background: #fafafa; padding: 2rem; }
        .node { padding: 10px; border: 2px solid #3b82f6; border-radius: 8px; margin: 10px 0; background: white; }

</head>
<body>
    <h1>Execution Plan Graph</h1>
    <div class="node">Step 1: Retrieve context</div>

    <div class="node">Step 3: Evaluate via heuristic</div>
</body>
</html>
