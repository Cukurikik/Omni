<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ray Cluster Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #fff; color: #333; padding: 20px; }
        .panel { border: 1px solid #ccc; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Ray Global Dashboard</h1>
    <div class="panel">
        <h2>Cluster Status</h2>
        <p>Nodes Active: 24</p>
        <p>Tasks Running: 1,402</p>
        <p>Status: <span class="success">Healthy</span></p>
    </div>
</body>
</html>
