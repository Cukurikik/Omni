<!DOCTYPE html>
<!-- OMNI Interface — Minimal Admin Login -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI Nexus Login</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { border: 1px solid #0f0; padding: 40px; text-align: center; box-shadow: 0 0 15px #0f0; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0a0; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>OMNI NEXUS AUTH</h2>
        <input type="text" placeholder="Identity Node" />
        <input type="password" placeholder="Access Key" />
        <button onclick="alert('Authenticating with Mother...')">INITIALIZE</button>
    </div>
</body>
</html>
