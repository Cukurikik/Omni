<!DOCTYPE html>
<!-- OMNI Interface — Real-time Web Socket Streaming Canvas -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI Streaming Console</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
        #console { white-space: pre-wrap; font-size: 16px; line-height: 1.5; }
        .cursor { display: inline-block; width: 8px; height: 16px; background: #58a6ff; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <h2>OMNI Mother Intelligence Stream</h2>
    <div id="console"></div><span class="cursor"></span>

    <script>
        const consoleDiv = document.getElementById('console');
        // Simulated WebSocket Connection
        const ws = new WebSocket('ws://localhost:8080/omni/stream');
        
        ws.onopen = () => {
            consoleDiv.innerHTML += "[SYSTEM] Connected to OMNI Nexus...<br><br>";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if(data.token) {
                consoleDiv.innerHTML += data.token;
                window.scrollTo(0, document.body.scrollHeight);
            }
        };

        ws.onerror = (error) => {
            consoleDiv.innerHTML += "<br>[ERROR] Connection lost.";
        };
    </script>
</body>
</html>
