<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI Framework Dashboard</title>
    <link rel="stylesheet" href="omni_dashboard.css">
</head>
<body>
    <div class="omni-container">
        <header class="omni-header">
            <h1>OMNI Framework</h1>
            <p>Global Cluster Analytics</p>
        </header>

        <main class="omni-grid">
            <section class="omni-card">
                <h2>LLM Throughput</h2>
                <div class="stat">24.5K <span>Tokens/sec</span></div>
            </section>
            
            <section class="omni-card">
                <h2>Active Nodes</h2>
                <div class="stat">1,024 <span>GPUs</span></div>
            </section>

            <section class="omni-card">
                <h2>Global Latency</h2>
                <div class="stat">45 <span>ms (TTFT)</span></div>
            </section>

            <section class="omni-card alert">
                <h2>System Status</h2>
                <div class="stat">OPERATIONAL</div>
            </section>
        </main>
    </div>
</body>
</html>
