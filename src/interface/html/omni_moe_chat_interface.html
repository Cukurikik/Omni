<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI Framework - MoE Chat</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 600px; height: 80vh; background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-header { padding: 20px; background-color: #21262d; border-bottom: 1px solid #30363d; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between;}
        .status-dot { height: 10px; width: 10px; background-color: #238636; border-radius: 50%; display: inline-block; margin-top: 5px; }
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; }
        .message.user { background-color: #1f6feb; color: white; align-self: flex-end; }
        .message.bot { background-color: #21262d; color: #c9d1d9; align-self: flex-start; border: 1px solid #30363d; }
        .chat-input { display: flex; padding: 15px; background-color: #161b22; border-top: 1px solid #30363d; }
        .chat-input input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: white; outline: none; }
        .chat-input button { padding: 12px 20px; margin-left: 10px; background-color: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-input button:hover { background-color: #2ea043; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>OMNI MoE Intelligence</span>
        <span class="status-dot" id="status-indicator"></span>
    </div>
    <div class="chat-history" id="chat-history">
        <div class="message bot">Hello! I am powered by the OMNI Mixture-of-Experts engine. How can I assist you today?</div>
    </div>
    <div class="chat-input">
        <input type="text" id="prompt-input" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Connect to the Node.js WebSocket streaming server
    const ws = new WebSocket('ws://localhost:8081');
    const sessionId = crypto.randomUUID();
    let currentBotMessageDiv = null;

    ws.onopen = () => {
        document.getElementById('status-indicator').style.backgroundColor = '#238636'; // Green
        ws.send(JSON.stringify({ action: 'start_stream', session_id: sessionId }));
    };

    ws.onclose = () => {
        document.getElementById('status-indicator').style.backgroundColor = '#da3633'; // Red
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        if (!currentBotMessageDiv) {
            currentBotMessageDiv = document.createElement('div');
            currentBotMessageDiv.className = 'message bot';
            document.getElementById('chat-history').appendChild(currentBotMessageDiv);
        }
        
        currentBotMessageDiv.innerHTML += data.text;
        
        if (data.is_final) {
            currentBotMessageDiv = null; // Reset for next message
        }
        
        scrollToBottom();
    };

    function sendMessage() {
        const input = document.getElementById('prompt-input');
        const text = input.value.trim();
        if (!text) return;

        // Append user message
        const userDiv = document.createElement('div');
        userDiv.className = 'message user';
        userDiv.innerText = text;
        document.getElementById('chat-history').appendChild(userDiv);
        input.value = '';
        scrollToBottom();

        // Trigger inference via Go API Gateway (Simulated here via WS for simplicity)
        // In production, this is an HTTP POST to the Gateway, which triggers the engine,
        // and the engine pushes tokens to Redis, which Node.js broadcasts over WS.
        console.log(`Sending to API Gateway: ${text}`);
    }

    function scrollToBottom() {
        const history = document.getElementById('chat-history');
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
