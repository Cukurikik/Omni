<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous Driving HUD</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #0f0; padding: 2rem; }
        .alert { color: #ffeb3b; font-weight: bold; }
        .danger { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Vision-Language-Action HUD</h1>
    <div id="vla-state">
        <p>Current Action: <span class="alert">Decelerating</span></p>
        <p>VLA Reasoning: "Pedestrian detected at crosswalk (confidence: 98%)"</p>
    </div>
</body>
</html>
