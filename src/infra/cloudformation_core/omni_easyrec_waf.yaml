# Omni EasyRec WAF (CloudFormation)
# Infrastructure Layer: WAF for recommendation API endpoints.
# Ref: HKUDS/EasyRec — EMNLP 2025
AWSTemplateFormatVersion: '2010-09-09'
Resources:
  OmniEasyRecWaf:
    Type: AWS::WAFv2::WebACL
    Properties:
      DefaultAction: { Allow: {} }
      Scope: REGIONAL
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: OmniEasyRecWafMetric
        SampledRequestsEnabled: true
