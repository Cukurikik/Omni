---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  resource: "omni:model:repository"
  rules:
    - actions:
        - "read"
        - "pull"
      effect: EFFECT_ALLOW
      roles:
        - user
        - admin
      condition:
        match:
          expr: request.resource.attr.visibility == "public"

    - actions:
        - "push"
        - "delete"
        - "fine-tune"
      effect: EFFECT_ALLOW
      roles:
        - admin
        - maintainer
      condition:
        match:
          expr: request.resource.attr.owner == request.principal.id

    - actions:
        - "*"
      effect: EFFECT_DENY
      roles:
        - guest
