# Omni Nginx Load Balancer (Nginx)
# Infrastructure & Network Layer
# Reverse proxy configured to handle HTTP/2 and gRPC streams, load balancing
# requests across the cluster of Omni Universal Binary nodes.

worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Logging configuration
    log_format omni_grpc '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_user_agent" '
                         '$grpc_status $upstream_addr';
                         
    access_log /var/log/nginx/omni_grpc.log omni_grpc;

    # Upstream Omni Cluster
    upstream omni_cluster {
        # Least connections load balancing for long-lived inference streams
        least_conn;
        server 10.0.1.10:50051 max_fails=3 fail_timeout=10s;
        server 10.0.1.11:50051 max_fails=3 fail_timeout=10s;
        server 10.0.1.12:50051 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 50051 http2;
        server_name api.omni-nexus.dev;

        # TLS Configuration (Assumed managed by certbot/external)
        # ssl_certificate /etc/letsencrypt/live/api.omni-nexus.dev/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/api.omni-nexus.dev/privkey.pem;

        # gRPC routing
        location /omni.v1.InferenceService {
            grpc_pass grpc://omni_cluster;
            
            # Timeout configurations
            grpc_read_timeout 120s;
            grpc_send_timeout 120s;
            
            # Retry logic
            grpc_next_upstream error timeout invalid_header http_502 http_503 http_504;
        }

        # Healthcheck endpoint
        location /health {
            return 200 '{"status": "OK", "version": "3.0.0-OMNI-NEXUS"}';
            add_header Content-Type application/json;
        }
    }
}
