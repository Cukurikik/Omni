# OMNI FRAMEWORK: BUSINESS LAYER
# DOMAIN: SCHEMA & DATA CONTRACT (GRAPHQL)
# ZERO MOCK - PRODUCTION READY
# ==========================================

schema {
  query: Query
  mutation: Mutation
}

"""
Omni Payment Aggregate Object encapsulating state logic from C# domain.
"""
type Payment {
  id: ID!
  amount: Float!
  status: PaymentStatus!
}

enum PaymentStatus {
  PENDING
  COMPLETED
  FAILED
}

type Query {
  """
  Retrieve a payment by UUID. Resolves via Omni Bridge to C# domain.
  """
  getPayment(id: ID!): Payment
}

type Mutation {
  """
  Initialize a new payment aggregate.
  """
  createPayment(amount: Float!): Payment!
  
  """
  Complete a pending payment.
  """
  completePayment(id: ID!): Boolean!
}
