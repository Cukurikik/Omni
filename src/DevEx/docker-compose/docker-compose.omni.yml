# OMNI Framework - Local Dev Docker Compose
# Orchestrates local development dependencies (Redis, Postgres, Kafka)

version: '3.8'

services:
  omni-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - omni-redis-data:/data
    command: redis-server --appendonly yes

  omni-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: omni_user
      POSTGRES_PASSWORD: omni_password
      POSTGRES_DB: omni_dev
    ports:
      - "5432:5432"
    volumes:
      - omni-pg-data:/var/lib/postgresql/data

  omni-zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  omni-kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - omni-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: omni-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://omni-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  omni-redis-data:
  omni-pg-data:
