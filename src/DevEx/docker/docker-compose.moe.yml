# OMNI Framework - Local MoE Development Topology
# Spins up the essential infrastructure components for end-to-end testing
# of the API Gateway, Routing, and Telemetry layers.

version: '3.8'

services:
  omni-redis:
    image: redis:7.0-alpine
    container_name: omni-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  omni-kafka:
    image: bitnami/kafka:latest
    container_name: omni-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@omni-kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

  omni-cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    container_name: omni-cerbos
    ports:
      - "3592:3592"
      - "3593:3593"
    volumes:
      # Mount the policy written in File 29
      - ../src/security/cerbos:/policies
    command: ["server", "--set=storage.disk.directory=/policies"]

  omni-postgres:
    image: postgres:15-alpine
    container_name: omni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: omni_secret_password
      POSTGRES_DB: omni_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
