# OMNI Framework - HAProxy configuration for LLM inference nodes
# Load balances incoming requests across multiple GPU workers

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend omni_llm_gateway
    bind *:80
    default_backend omni_gpu_workers

backend omni_gpu_workers
    balance roundrobin
    option httpchk GET /health
    # List of backend inference workers
    server gpu-worker-1 10.0.0.11:8000 check
    server gpu-worker-2 10.0.0.12:8000 check
    server gpu-worker-3 10.0.0.13:8000 check backup
