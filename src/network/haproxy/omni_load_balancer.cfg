# HAProxy Configuration for OMNI Global Gateway
global
    log /dev/log local0
    maxconn 100000
    user haproxy
    group haproxy

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend omni_gateway
    bind *:80
    bind *:443 ssl crt /etc/ssl/omni_cert.pem
    
    # Route inference traffic to GPU nodes
    acl is_inference path_beg /api/v1/infer
    use_backend omni_gpu_cluster if is_inference
    
    # Route static/UI traffic to frontend nodes
    default_backend omni_ui_cluster

backend omni_gpu_cluster
    balance leastconn
    server gpu-node-1 10.0.1.10:8080 check
    server gpu-node-2 10.0.1.11:8080 check
    server gpu-node-3 10.0.1.12:8080 check

backend omni_ui_cluster
    balance roundrobin
    server ui-node-1 10.0.2.10:80 check
    server ui-node-2 10.0.2.11:80 check
