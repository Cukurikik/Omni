# OMNI Framework - NGINX Reverse Proxy
# Serves the HTML dashboard and routes API traffic securely

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=omni_api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name omni.local;

        # Serve static UI dashboard
        location / {
            root /var/www/omni_dashboard;
            index omni_dashboard.html;
        }

        # Route API requests to the Go Gateway
        location /api/ {
            limit_req zone=omni_api_limit burst=20 nodelay;
            proxy_pass http://localhost:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Websockets to Crystal Relay
        location /ws/ {
            proxy_pass http://localhost:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
