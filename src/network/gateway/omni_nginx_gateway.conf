# OMNI Network & Gateway Layer
# Nginx Configuration for high-performance load-balancing of the Omni Universal Binary endpoints

worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # OMNI Engine Upstream Cluster (Elixir/Go/Crystal nodes)
    upstream omni_inference_cluster {
        least_conn; # Route to node with least active connections (ideal for heavy inference)
        server 10.0.1.101:8080 max_fails=3 fail_timeout=30s;
        server 10.0.1.102:8080 max_fails=3 fail_timeout=30s;
        server 10.0.1.103:8080 max_fails=3 fail_timeout=30s backup;
        keepalive 64;
    }

    # WebSocket Upstream for continuous GAMBA Splat streams
    upstream omni_streaming_cluster {
        hash $remote_addr consistent;
        server 10.0.2.101:8081;
        server 10.0.2.102:8081;
    }

    server {
        listen 80;
        server_name api.omniframework.dev;

        # Standard REST Inference Endpoint
        location /api/v1/infer {
            proxy_pass http://omni_inference_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Increased timeouts for heavy transformer generation
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # WebSocket Streaming Endpoint
        location /stream {
            proxy_pass http://omni_streaming_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s; # Keep long-lived sessions active
        }

        # Health Check
        location /health {
            access_log off;
            return 200 "OMNI Gateway Active\n";
        }
    }
}
