// moe_grpc_proto.proto — Network / Protobuf
// Layer: Network / Inter-Service — MoE gRPC Definitions
//
// Defines the strict protobuf contract for sending token sequences from 
// the API Gateway to the MoE Inference Engine, and receiving the generated outputs.

syntax = "proto3";

package omni.moe.grpc;
option go_package = "omni/moe/grpc";

// The core MoE inference service
service MoEInferenceService {
    // Standard synchronous generation
    rpc GenerateOutput (InferenceRequest) returns (InferenceResponse);
    
    // HTTP/2 Bidirectional stream for Continuous Batching
    rpc StreamTokens (stream TokenChunk) returns (stream TokenChunk);
}

message InferenceRequest {
    string request_id = 1;
    string tenant_id = 2;         // For isolation/billing
    repeated int32 input_ids = 3; // The tokenized input prompt
    int32 max_new_tokens = 4;
    float temperature = 5;
    float top_p = 6;
}

message InferenceResponse {
    string request_id = 1;
    repeated int32 output_ids = 2; // The generated tokens
    int32 completion_time_ms = 3;
    
    // MoE specific telemetry returned to the gateway
    RoutingMetrics routing_metrics = 4;
}

message RoutingMetrics {
    int32 total_experts_activated = 1;
    map<int32, int32> tokens_per_expert = 2; // Map of expert_id -> token_count
}

// Used for bidirectional streaming
message TokenChunk {
    string request_id = 1;
    int32 token_id = 2;     // A single token
    bool is_eos = 3;        // End of sequence flag
}
