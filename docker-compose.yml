version: "3.8"

services:
  omni-mother-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: omni-nexus-core:latest
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - OMNI_ENV=production
      - LOG_LEVEL=info
      - OMNI_SUBSTRATE_SEVERANCE=true
    volumes:
      - omni_akashic_data:/var/omni/astrogation
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16G
        reservations:
          cpus: "4.0"
          memory: 8G
    restart: unless-stopped

volumes:
  omni_akashic_data:
    driver: local
