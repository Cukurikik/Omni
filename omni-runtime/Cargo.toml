[package]
name = "omni-runtime"
version = "2.0.0"
edition = "2021"
authors = ["Antigravity <omni@nexus.local>"]
description = "OMNI LLVM Multi-Language Runtime JIT Compiler"

[lib]
name = "omnirt"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
wasm-bindgen = "0.2.87"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
