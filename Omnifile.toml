[package]
name        = "omni-batch-37"
version     = "1.0.0"
authors     = ["Mother <mother@antigravity.dev>"]
description = "OMNI Semester 12 Batch 37 Production Engines"
license     = "OMNI-Open"
edition     = "omni-2026"

[dependencies]
omni-std     = "^2.0"

[permissions.fs]
allow_read  = ["./**"]
allow_write = ["./**"]

[permissions]
allow_net    = ["api.github.com", "gemini.googleapis.com"]
allow_thread = true

[build]
target       = ["wasm32", "x86_64-linux", "aarch64-apple"]
optimize     = "release"
llvm_passes  = ["vectorize", "inline", "unroll"]
